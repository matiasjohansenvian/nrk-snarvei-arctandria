    <template id="explanationcard-plug-template">
      <div class="explanationcard-plug-container">
        <div class="explanationcard-plug-image">
          <img class="explanationcard-plug-img" aria-hidden="true" />
        </div>
        <div class="explanationcard-plug-text-section">
          <span class="explanationcard-plug-kicker"></span>
          <h2 class="explanationcard-plug-title"></h2>
          <p class="explanationcard-plug-lead"></p>
        </div>
      </div>

              id="feedback-textarea"
